name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'lib/**', 'ios/**', 'pubspec.yaml', 'assets/**', 'test/**' ]

jobs:
  build-ipa:
    name: Build unsigned IPA on macOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env for build
        shell: bash
        run: |
          printf 'GITHUB_TOKEN=%s\nREPO_OWNER=%s\nREPO_NAME=%s\n' \
            "${{ secrets.JKR_GITHUB_TOKEN }}" \
            "${{ secrets.JKR_REPO_OWNER }}" \
            "${{ secrets.JKR_REPO_NAME }}" > .env
          cat .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build IPA (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Export unsigned IPA from archive
        shell: bash
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates
          ls -la build/ios/ipa/

      - name: Create release + upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ github.run_number }}
          name: "JKR FM Guide iOS - build #${{ github.run_number }}"
          body: |
            Unsigned IPA built on GitHub macOS runners.
            Install on iPhone via AltStore (AltServer on Windows/Mac) or Xcode with your Apple ID.
          files: build/ios/ipa/*.ipa
          fail_on_unmatched_files: false
